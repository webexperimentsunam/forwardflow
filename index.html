    <style>

      :root {
        color-scheme: light dark;

        margin-bottom: 6px !important;

        ========================================================= */

      @media (max-width: 700px) and (orientation: portrait) {

        #jspsych-dynamic-plugin-container {
          transform:
            translate(-50%, -50%)
            scale(var(--expbuilder-mobile-scale))
            !important;

          transform-origin: center center !important;
        }

      }
      /* =========================================================
        SURVEY SOCIODEMOGRÁFICO

        ========================================================= */


      /* ---------------------------------------------------------
        CONTENEDOR EXTERIOR CREADO POR EXPBUILDER
        --------------------------------------------------------- */

      #jspsych-survey-surveyjs-container {
        width: 900px !important;
        height: 1080px !important;

        max-width: 900px !important;
        max-height: 1080px !important;

        min-width: 900px !important;
        min-height: 1080px !important;

        box-sizing: border-box !important;

        background: #ffffff !important;

        overflow: hidden !important;

        --------------------------------------------------------- */

        width: 100% !important;

        min-width: 0 !important;
        max-width: none !important;

        overflow-x: hidden !important;

        font-family: sans-serif !important;

        border: none !important;
        box-shadow: none !important;

      #jspsych-survey-surveyjs-container
      .sd-container-modern,

      #jspsych-survey-surveyjs-container
      .sv-container-modern,

      #jspsych-survey-surveyjs-container
      .sd-body,

      #jspsych-survey-surveyjs-container
      .sv_body,

      .sd-page,

      #jspsych-survey-surveyjs-container
      .sv_page,

        background: #ffffff !important;

        border: none !important;
        box-shadow: none !important;

      .sd-radio--checked
      .sd-radio__decorator::after {

  function normalizeExpBuilderInputGeometry() {

 
    const container =
      document.getElementById('jspsych-dynamic-plugin-container');

    if (!container) {
      return;
    }

    // Tamaño REAL del layer del trial actual
    const designWidth = parseFloat(container.style.width);
    const designHeight = parseFloat(container.style.height);

    if (
      !Number.isFinite(designWidth) ||
      !Number.isFinite(designHeight) ||
      designWidth <= 0 ||
      designHeight <= 0
    ) {
      return;
    }


    // ----------------------------------------------------------
    // Encontrar los inputs creados por ExpBuilder
    // ----------------------------------------------------------

    const originalInputs = [
      ...container.querySelectorAll('.jspsych-input-response')
    ];

    const hasCreativityTextarea =
      container.querySelector(
        '.creativity-long-text, .creativity2-long-text'
      );

    // Forward Flow tiene muchos inputs.
    // Creatividad tiene nuestro textarea especial.
    const isForwardFlow = originalInputs.length >= 10;
    const isCreativity = !!hasCreativityTextarea;

    // Detectar específicamente el input de fecha de nacimiento
    const isBirthdate = originalInputs.some(function(input) {
      return input.type === 'date';
    });

    // Sólo corregir las tareas que sabemos que lo necesitan
    if (!isForwardFlow && !isCreativity && !isBirthdate) {
      return;
    }


    // ----------------------------------------------------------
    // 1. CORREGIR POSICIÓN DEL CONTENEDOR DE INPUTS
    // ----------------------------------------------------------

    const groups = [];

    originalInputs.forEach(function(input) {

      const parent = input.parentElement;

      if (parent && !groups.includes(parent)) {
        groups.push(parent);
      }

    });


    groups.forEach(function(group) {

      // ExpBuilder genera algo como:
      //
      // left: calc(50% + 0vw)
      // top:  calc(50% - 6.56vh)

      const leftValue = group.style.left;
      const topValue = group.style.top;


      // ========================================================
      // LEFT: aceptar tanto "+" como "-"
      // ========================================================

      const leftMatch = leftValue.match(
        /calc\(50%\s*([+-])\s*(\d+(?:\.\d+)?)vw\)/i
      );

      if (leftMatch) {

        const direction =
          leftMatch[1] === '+' ? 1 : -1;

        const offsetVW =
          parseFloat(leftMatch[2]);

        const leftPx =
          (designWidth / 2) +
          direction *
          (offsetVW / 100) *
          designWidth;

        group.style.left = leftPx + 'px';
      }


      // ========================================================
      // TOP: aceptar tanto "+" como "-"
      // IMPORTANTE para coordenadas Y negativas
      // ========================================================

      const topMatch = topValue.match(
        /calc\(50%\s*([+-])\s*(\d+(?:\.\d+)?)vh\)/i
      );

      if (topMatch) {

        const direction =
          topMatch[1] === '+' ? 1 : -1;

        const offsetVH =
          parseFloat(topMatch[2]);

        const topPx =
          (designHeight / 2) +
          direction *
          (offsetVH / 100) *
          designHeight;

        group.style.top = topPx + 'px';
      }

    });


    // ----------------------------------------------------------
    // 2. CORREGIR TAMAÑO DE INPUTS
    // ----------------------------------------------------------

    const fields = container.querySelectorAll(
      '.jspsych-input-response,' +
      '.creativity-long-text,' +
      '.creativity2-long-text'
    );


    fields.forEach(function(element) {

      function vwToDesignPixels(property) {

        const value = element.style[property];

        // Sólo convertir valores que todavía estén en vw
        if (!value || !value.trim().endsWith('vw')) {
          return;
        }

        const number = parseFloat(value);

        if (!Number.isFinite(number)) {
          return;
        }

        element.style[property] =
          ((number / 100) * designWidth) + 'px';
      }


      // Lo mismo que hacía el primer fix que sí funcionaba
      vwToDesignPixels('width');
      vwToDesignPixels('height');
      vwToDesignPixels('fontSize');

    });

  }

  // después de que el canvas ya está visible.
  // ============================================================

  (function installWebKitDynamicCanvasRefreshFix() {

    const ua = navigator.userAgent;


    // ----------------------------------------------------------
    // iPhone / iPad:
    // todos los navegadores de iOS utilizan WebKit.
    // ----------------------------------------------------------

    const isIOS =
      /iPad|iPhone|iPod/i.test(ua) ||
      (
        navigator.platform === 'MacIntel' &&
        navigator.maxTouchPoints > 1
      );


    // ----------------------------------------------------------
    // Safari de escritorio.
    // Excluimos Chrome/Edge/Opera/etc.
    // ----------------------------------------------------------

    const isDesktopSafari =
      /AppleWebKit/i.test(ua) &&
      /Safari/i.test(ua) &&
      !/Chrome|Chromium|CriOS|Edg|EdgiOS|OPR|FxiOS/i.test(ua);


    const needsWebKitRefresh =
      isIOS || isDesktopSafari;


    if (!needsWebKitRefresh) {
      return;
    }


    console.log(
      'ExpBuilder: WebKit canvas refresh fix activado'
    );


    // Cada ensayo DynamicPlugin crea un canvas nuevo.
    // WeakSet nos permite recordar cuáles ya corregimos.
    const correctedCanvases =
      new WeakSet();

    const pendingCanvases =
      new WeakSet();


    function scheduleSecondRender(canvas) {

      if (
        !canvas ||
        correctedCanvases.has(canvas) ||
        pendingCanvases.has(canvas)
      ) {
        return;
      }


      pendingCanvases.add(canvas);

      let attempts = 0;


      function tryRender() {

        // Dos frames:
        //
        // 1. permitir que ExpBuilder muestre su contenedor
        // 2. volver a pintar cuando el canvas ya está visible

        requestAnimationFrame(function() {

          requestAnimationFrame(function() {

            if (!canvas.isConnected) {
              return;
            }


            const container =
              canvas.closest(
                '#jspsych-dynamic-plugin-container'
              );


            const stages =
              container?.__dynamicCanvasStages;


            if (
              stages &&
              typeof stages.values === 'function' &&
              stages.size > 0
            ) {

              let rendered = false;


              for (
                const stage of stages.values()
              ) {

                if (
                  stage &&
                  typeof stage.render === 'function'
                ) {

                  stage.render();

                  rendered = true;
                }

              }


              if (rendered) {

                correctedCanvases.add(canvas);

                console.log(
                  'ExpBuilder: segundo render WebKit aplicado'
                );

                return;
              }

            }


            // En caso de que el stage todavía no esté listo,
            // probar unos frames más.
            attempts += 1;

            if (attempts < 8) {
              tryRender();
            }

          });

        });

      }


      tryRender();
    }


    function inspectNode(node) {

      if (!(node instanceof Element)) {
        return;
      }


      if (
        node.matches(
          '#jspsych-dynamic-webgl-stage'
        )
      ) {

        scheduleSecondRender(node);

      }


      const canvases =
        node.querySelectorAll?.(
          '#jspsych-dynamic-webgl-stage'
        );


      if (canvases) {

        canvases.forEach(
          scheduleSecondRender
        );

      }

    }


    // ----------------------------------------------------------
    // Detectar cada nuevo canvas creado por DynamicPlugin
    // ----------------------------------------------------------

    const observer =
      new MutationObserver(function(mutations) {

        mutations.forEach(function(mutation) {

          mutation.addedNodes.forEach(
            inspectNode
          );

        });

      });


    observer.observe(
      document.documentElement,
      {
        childList: true,
        subtree: true
      }
    );


    // Por si el canvas ya existiera.
    inspectNode(document.documentElement);

  })();

                        fieldArray[compIndex].survey_json.elements[questionIndex].defaultValue = valueToSet;
                      }
                    }
                  }
                }
              }
            } else if (parts.length === 3) {
              // Format: fieldType::componentName::property (for DynamicPlugin components)
              const [fieldType, componentName, propName] = parts;
              
              if (fieldType && componentName && propName) {
                // Find the component by name in the field array
                const fieldArray = trial[fieldType];
                if (Array.isArray(fieldArray)) {
                  const compIndex = fieldArray.findIndex(c => c.name === componentName);
                  if (compIndex !== -1) {
                    // Apply the override value (from typed or csv)
                    let valueToSet;
                    if (param.source === 'typed') {
                      valueToSet = param.value;
                    } else if (param.source === 'csv') {
                      valueToSet = trial[param.value];
                    }
                    
                    if (valueToSet !== undefined && valueToSet !== null) {
                      fieldArray[compIndex][propName] = valueToSet;
                    }
                  }
                }
              }
            } else {
              // Normal parameter (not nested survey question)
              if (param.source === 'typed' && param.value !== undefined && param.value !== null) {
                trial[key] = param.value;
              } else if (param.source === 'csv' && param.value !== undefined && param.value !== null) {
                trial[key] = trial[param.value];
              }
            }
          }
        });
        // Clear the custom parameters after applying them
        window.branchCustomParameters = null;
      }
      
    },
    
    on_finish: function(data) {
      if (window.branchingActive) {
        jsPsych.abortExperiment('', {});
      }
    },};
    const End_experiment_procedure = {
    timeline: 
    [End_experiment_timeline],
    timeline_variables: test_stimuli_End_experiment,
    
    conditional_function: function() {
      const currentId = 1789349742456;
      
      const navigationDecision =
        window.ExpBuilderNavigation?.enterItem(currentId, 'trial');
      if (navigationDecision !== null && navigationDecision !== undefined) {
        return navigationDecision;
      }
      
      // Si skipRemaining está activo (branching normal), verificar si este es el trial objetivo
      if (window.skipRemaining) {
        if (String(currentId) === String(window.nextTrialId)) {
          window.ExpBuilderRuntime?.emit('branch-target-enter', {
            targetId: currentId
          });
          window.skipRemaining = false;
          window.nextTrialId = null;
          return true;
        }
        return false;
      }
      
      return true;
    },
  
    
    };
    timeline.push(End_experiment_procedure);
  
    jsPsych.run(timeline);

    }
})().catch(error => {
  console.warn('Forward Flow: no se pudo iniciar o recuperar la sesión:', error);
  _showLoading('No se pudo iniciar o recuperar la sesión. Contacta al equipo de investigación.');
  _setLoadingMsg(error.message);
});
