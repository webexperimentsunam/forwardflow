(function installExpBuilderRuntime(targetWindow, targetDocument) {

    if (value instanceof Error) {

    if (value && typeof value === "object") {

        name: value.name || "Error",

    if (typeof targetWindow.CustomEvent === "function") {

        new targetWindow.CustomEvent("expbuilder:runtime-event", {
          detail: event,
        }),
      );
    }
    return event;
  }

    let overlay = targetDocument.getElementById("expbuilder-runtime-error");

      overlay = targetDocument.createElement("div");
      overlay.id = "expbuilder-runtime-error";
      overlay.setAttribute("role", "alert");
      overlay.setAttribute("aria-live", "assertive");

        '<h1 style="font-size:24px;margin:0 0 12px">The experiment could not continue</h1>' +
        '<p style="margin:0 0 8px">Please contact the experiment administrator.</p>' +
        '<p data-runtime-error-code style="font-family:monospace;margin:0"></p>' +
        "</div>";
      targetDocument.body.appendChild(overlay);
    }
    const code = overlay.querySelector("[data-runtime-error-code]");
    if (code) code.textContent = `Error reference: ${errorRecord.code}`;
    const loading = targetDocument.getElementById("jspsych-loading-overlay");
    if (loading) loading.style.display = "none";
  }

  function reportError(value, context) {
    const serialized = serializeError(value);
    const errorKey = `${serialized.name}:${serialized.message}`;
    const now = Date.now();
    if (errorKey === lastErrorKey && now - lastErrorAt < 50) {
      return errors[errors.length - 1];
    }
    lastErrorKey = errorKey;
    lastErrorAt = now;
    const record = {
      code: `RUNTIME-${String(errors.length + 1).padStart(3, "0")}`,
      ...serialized,
      context: context || {},
    };
    errors.push(record);
    emit("runtime-error", record);
    showError(record);
    return record;
  }

  const api = {
    version: 2,
    events,
    errors,
    emit,
    // Kept for generated artifacts created before the canonical emit API.
    trace: emit,
    reportError,
    snapshot: () => ({ events: events.slice(), errors: errors.slice() }),
  };

  const originalConsoleError = targetWindow.console.error.bind(
    targetWindow.console,
  );

    originalConsoleError(...args);
    reportError(args[0], { source: "console.error", arguments: args.slice(1) });
  };

    if (event.target && event.target !== targetWindow) {
      const target = event.target;

      line: event.lineno,

  });

  return api;

  function _showCaptchaGate(siteKey, provider) {

      if (!document.getElementById('captcha-script')) {
        const s = document.createElement('script');
        s.id = 'captcha-script';
        s.async = true;
        s.defer = true;
        window._captchaReady = function() { window._captchaAPIReady = true; };
        if (provider === 'recaptcha') {
          s.src = 'https://www.google.com/recaptcha/api.js?render=explicit&onload=_captchaReady';
        } else {
          s.src = 'https://js.hcaptcha.com/1/api.js?onload=_captchaReady&render=explicit';
        }

        </p>
        <div id="captcha-widget"></div>
      `;
      document.body.appendChild(overlay);

      function _renderWidget() {
        if (provider === 'recaptcha') {
          if (typeof grecaptcha === 'undefined' || !window._captchaAPIReady) {
            setTimeout(_renderWidget, 100);
            return;
          }
          grecaptcha.render('captcha-widget', {
            sitekey: siteKey,
            theme: 'light',
            callback: function(token) {
              const el = document.getElementById('jspsych-captcha-overlay');
              if (el) el.remove();
              resolve(token);
            },
            'error-callback': function() { grecaptcha.reset(); }
          });
        } else {
          // hCaptcha
          if (typeof hcaptcha === 'undefined' || !window._captchaAPIReady) {
            setTimeout(_renderWidget, 100);
            return;
          }
          hcaptcha.render('captcha-widget', {
            sitekey: siteKey,

              const el = document.getElementById('jspsych-captcha-overlay');
              if (el) el.remove();

          });
        }
      }

      _renderWidget();
    });

        clientTimestamp: trials[0]?.clientTimestamp || Date.now(),
        trial_index: `batch_${batchNumber}` // ID único para batch

        method: "POST",

          sessionId: trialSessionId,
          data: concatenatedData,
          storage: "googledrive",

        if (!res.ok) {
          return res.text().then(text => {
            console.error('Error sending batch:', text);

          });
        }
        return res.json();

      .then(result => {
        if (result && result.success) {
          console.log(`Batch #${batchNumber} sent successfully`);
        }
      })
      .catch(error => {
        console.error('Error in sendBatchConcatenated:', error);
        throw error;
      })
      .finally(() => {
        const index = pendingBatchSaves.indexOf(batchPromise);
        if (index > -1) {
          pendingBatchSaves.splice(index, 1);

      });
      
      pendingBatchSaves.push(batchPromise);

  function normalizeExpBuilderInputGeometry() {

 
    const container =
      document.getElementById('jspsych-dynamic-plugin-container');

    if (!container) {
      return;
    }

    // Tamaño REAL del layer del trial actual
    const designWidth = parseFloat(container.style.width);
    const designHeight = parseFloat(container.style.height);

    if (
      !Number.isFinite(designWidth) ||
      !Number.isFinite(designHeight) ||
      designWidth <= 0 ||
      designHeight <= 0
    ) {
      return;
    }


    // ----------------------------------------------------------
    // Encontrar los inputs creados por ExpBuilder
    // ----------------------------------------------------------

    const originalInputs = [
      ...container.querySelectorAll('.jspsych-input-response')
    ];

    const hasCreativityTextarea =
      container.querySelector(
        '.creativity-long-text, .creativity2-long-text'
      );

    // Forward Flow tiene muchos inputs.
    // Creatividad tiene nuestro textarea especial.
    const isForwardFlow = originalInputs.length >= 10;
    const isCreativity = !!hasCreativityTextarea;

    // Detectar específicamente el input de fecha de nacimiento
    const isBirthdate = originalInputs.some(function(input) {
      return input.type === 'date';
    });

    // Sólo corregir las tareas que sabemos que lo necesitan
    if (!isForwardFlow && !isCreativity && !isBirthdate) {
      return;
    }


    // ----------------------------------------------------------
    // 1. CORREGIR POSICIÓN DEL CONTENEDOR DE INPUTS
    // ----------------------------------------------------------

    const groups = [];

    originalInputs.forEach(function(input) {

      const parent = input.parentElement;

      if (parent && !groups.includes(parent)) {
        groups.push(parent);
      }

    });


    groups.forEach(function(group) {

      // ExpBuilder genera algo como:
      //
      // left: calc(50% + 0vw)
      // top:  calc(50% - 6.56vh)

      const leftValue = group.style.left;
      const topValue = group.style.top;


      // ========================================================
      // LEFT: aceptar tanto "+" como "-"
      // ========================================================

      const leftMatch = leftValue.match(
        /calc\(50%\s*([+-])\s*(\d+(?:\.\d+)?)vw\)/i
      );

      if (leftMatch) {

        const direction =
          leftMatch[1] === '+' ? 1 : -1;

        const offsetVW =
          parseFloat(leftMatch[2]);

        const leftPx =
          (designWidth / 2) +
          direction *
          (offsetVW / 100) *
          designWidth;

        group.style.left = leftPx + 'px';
      }


      // ========================================================
      // TOP: aceptar tanto "+" como "-"
      // IMPORTANTE para coordenadas Y negativas
      // ========================================================

      const topMatch = topValue.match(
        /calc\(50%\s*([+-])\s*(\d+(?:\.\d+)?)vh\)/i
      );

      if (topMatch) {

        const direction =
          topMatch[1] === '+' ? 1 : -1;

        const offsetVH =
          parseFloat(topMatch[2]);

        const topPx =
          (designHeight / 2) +
          direction *
          (offsetVH / 100) *
          designHeight;

        group.style.top = topPx + 'px';
      }

    });


    // ----------------------------------------------------------
    // 2. CORREGIR TAMAÑO DE INPUTS
    // ----------------------------------------------------------

    const fields = container.querySelectorAll(
      '.jspsych-input-response,' +
      '.creativity-long-text,' +
      '.creativity2-long-text'
    );


    fields.forEach(function(element) {

      function vwToDesignPixels(property) {

        const value = element.style[property];

        // Sólo convertir valores que todavía estén en vw
        if (!value || !value.trim().endsWith('vw')) {
          return;
        }

        const number = parseFloat(value);

        if (!Number.isFinite(number)) {
          return;
        }

        element.style[property] =
          ((number / 100) * designWidth) + 'px';
      }


      // Lo mismo que hacía el primer fix que sí funcionaba
      vwToDesignPixels('width');
      vwToDesignPixels('height');
      vwToDesignPixels('fontSize');

    });

  }

  function updateSurveyScrollHint() {

    const outer =
      document.getElementById(
        'jspsych-survey-surveyjs-container'
      );

    if (!outer) {
      return;
    }


    const scroller =
      outer.querySelector(
        '.jspsych-survey-container'
      );

    if (!scroller) {
      return;
    }


    // Crear el indicador una sola vez
    let hint =
      outer.querySelector(
        '.survey-scroll-hint'
      );


    if (!hint) {

      hint =
        document.createElement('div');

      hint.className =
        'survey-scroll-hint';

      hint.innerHTML =
        'Más preguntas &nbsp; ↓';

      outer.appendChild(hint);
    }


    function refreshHint() {

      const tolerance = 10;

      const canScroll =
        scroller.scrollHeight >
        scroller.clientHeight + tolerance;

      const hasMoreBelow =
        scroller.scrollTop +
        scroller.clientHeight <
        scroller.scrollHeight - tolerance;


      // Mostrar solamente si:
      // 1. realmente hay scroll
      // 2. todavía hay contenido debajo

      hint.style.display =
        canScroll && hasMoreBelow
          ? 'block'
          : 'none';
    }


    refreshHint();


    // Evitar agregar múltiples listeners
    if (
      scroller.dataset.surveyScrollHintBound !== '1'
    ) {

      scroller.dataset.surveyScrollHintBound = '1';

      scroller.addEventListener(
        'scroll',
        refreshHint,
        { passive: true }
      );
    }
  }

  (function installWebKitDynamicCanvasRefreshFix() {

    const ua = navigator.userAgent;


    // ----------------------------------------------------------
    // iPhone / iPad:
    // todos los navegadores de iOS utilizan WebKit.
    // ----------------------------------------------------------

    const isIOS =
      /iPad|iPhone|iPod/i.test(ua) ||
      (
        navigator.platform === 'MacIntel' &&
        navigator.maxTouchPoints > 1
      );


    // ----------------------------------------------------------
    // Safari de escritorio.
    // Excluimos Chrome/Edge/Opera/etc.
    // ----------------------------------------------------------

    const isDesktopSafari =
      /AppleWebKit/i.test(ua) &&
      /Safari/i.test(ua) &&
      !/Chrome|Chromium|CriOS|Edg|EdgiOS|OPR|FxiOS/i.test(ua);


    const needsWebKitRefresh =
      isIOS || isDesktopSafari;


    if (!needsWebKitRefresh) {
      return;
    }


    console.log(
      'ExpBuilder: WebKit canvas refresh fix activado'
    );


    // Cada ensayo DynamicPlugin crea un canvas nuevo.
    // WeakSet nos permite recordar cuáles ya corregimos.
    const correctedCanvases =
      new WeakSet();

    const pendingCanvases =
      new WeakSet();


    function scheduleSecondRender(canvas) {

      if (
        !canvas ||
        correctedCanvases.has(canvas) ||
        pendingCanvases.has(canvas)
      ) {
        return;
      }


      pendingCanvases.add(canvas);

      let attempts = 0;


      function tryRender() {

        // Dos frames:
        //
        // 1. permitir que ExpBuilder muestre su contenedor
        // 2. volver a pintar cuando el canvas ya está visible

        requestAnimationFrame(function() {

          requestAnimationFrame(function() {

            if (!canvas.isConnected) {
              return;
            }


            const container =
              canvas.closest(
                '#jspsych-dynamic-plugin-container'
              );


            const stages =
              container?.__dynamicCanvasStages;


            if (
              stages &&
              typeof stages.values === 'function' &&
              stages.size > 0
            ) {

              let rendered = false;


              for (
                const stage of stages.values()
              ) {

                if (
                  stage &&
                  typeof stage.render === 'function'
                ) {

                  stage.render();

                  rendered = true;
                }

              }


              if (rendered) {

                correctedCanvases.add(canvas);

                console.log(
                  'ExpBuilder: segundo render WebKit aplicado'
                );

                return;
              }

            }


            // En caso de que el stage todavía no esté listo,
            // probar unos frames más.
            attempts += 1;

            if (attempts < 8) {
              tryRender();
            }

          });

        });

      }


      tryRender();
    }


    function inspectNode(node) {

      if (!(node instanceof Element)) {
        return;
      }


      if (
        node.matches(
          '#jspsych-dynamic-webgl-stage'
        )
      ) {

        scheduleSecondRender(node);

      }


      const canvases =
        node.querySelectorAll?.(
          '#jspsych-dynamic-webgl-stage'
        );


      if (canvases) {

        canvases.forEach(
          scheduleSecondRender
        );

      }

    }


    // ----------------------------------------------------------
    // Detectar cada nuevo canvas creado por DynamicPlugin
    // ----------------------------------------------------------

    const observer =
      new MutationObserver(function(mutations) {

        mutations.forEach(function(mutation) {

          mutation.addedNodes.forEach(
            inspectNode
          );

        });

      });


    observer.observe(
      document.documentElement,
      {
        childList: true,
        subtree: true
      }
    );

    inspectNode(document.documentElement);
